<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>高端工業戰情室看板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f0f2f5;
            --card-shadow: 0 5px 15px rgba(0,0,0,0.05);
            --primary-color: #0d6efd;
        }

        body, html { height: 100vh; margin: 0; background-color: var(--bg-body); font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }
        .dashboard-wrapper { height: 100vh; padding: 15px 20px; display: flex; flex-direction: column; }
        
        /* 頂部資訊列 */
        .top-info-bar {
            background: white; border-radius: 12px; padding: 12px 24px;
            box-shadow: var(--card-shadow); display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; flex-shrink: 0;
        }
        .info-item { font-size: 1.1rem; }
        .info-label { color: #6c757d; font-size: 0.9rem; margin-right: 8px; }

        .dashboard-card { 
            background: white; border-radius: 16px; overflow: hidden; 
            display: flex; flex-direction: column; height: 100%; 
            box-shadow: var(--card-shadow); border: none;
        }

        .card-header-dark { 
            background-color: #212529; color: white; padding: 12px 20px; 
            font-weight: 700; flex-shrink: 0; letter-spacing: 1px; text-align: center;
        }

        /* 左側站台切換按鈕 */
        .device-selector {
            background: #fff; border: 1px solid #e9ecef; border-radius: 12px;
            padding: 18px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
        }
        .device-selector:hover { background: #f8f9fa; }
        .device-selector.active { 
            background: #f0f7ff; border-color: var(--primary-color); 
            border-left: 5px solid var(--primary-color);
        }

        /* 核心指標顯示區 */
        .hero-metric {
            background: linear-gradient(135deg, #ffffff 0%, #f1f4f9 100%);
            border-radius: 20px; padding: 30px; border: 1px solid #e1e8f0; text-align: center;
        }
        .val-hero { font-family: 'JetBrains Mono'; font-size: 5.5rem; font-weight: 800; color: #1a1a1a; line-height: 1; }
        .metric-label { font-size: 1rem; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 1px; }

        /* 下方參數方塊 */
        .param-box {
            background: white; border: 1px solid #f1f3f5; border-radius: 12px;
            padding: 16px; text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center;
        }
        .param-val { font-family: 'JetBrains Mono'; font-size: 2.5rem; font-weight: 700; margin-top: 10px; }

        /* 圖表佔位符 */
        .chart-placeholder {
            background: #f8f9fa; border: 1px dashed #ced4da; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; color: #adb5bd;
            height: 100%; min-height: 150px;
        }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <!-- 頂部資訊列 -->
    <div class="top-info-bar">
        <div class="info-item"><span class="info-label">目前工廠地區</span><strong class="text-dark">台灣新竹科學園區 - A廠區</strong></div>
        <div class="info-item"><span class="info-label">操作人員</span><strong class="text-primary">王大明 (ID: 8859)</strong></div>
        <div class="info-item"><span class="info-label">目前時間</span><strong id="current-time" class="text-dark">載入中...</strong></div>
    </div>

        <!-- 主體內容 -->
    <!-- 加入 min-height: 0 確保 flex 子元素不會因為內容過多而撐破高度 -->
    <div class="row g-3 flex-grow-1" style="min-height: 0;">
        <!-- 左側：設備總覽 -->
        <div class="col-md-3">
            <div class="dashboard-card p-3 h-100">
                <div class="mb-3 border-bottom pb-2">
                    <h5 class="fw-bold m-0 text-dark">設備總覽</h5>
                </div>
                <div class="flex-grow-1 overflow-auto pe-2">
                    <div class="device-selector active" onclick="updateDashboard('ST-01', 94.5, 18.5, 99.8, this)">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold fs-5">ST-01</span>
                            <span class="badge bg-success fs-6">運轉中</span>
                        </div>
                    </div>
                    <div class="device-selector" onclick="updateDashboard('ST-02', 82.1, 15.2, 98.5, this)">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold fs-5">ST-02</span>
                            <span class="badge bg-warning text-dark fs-6">待機中</span>
                        </div>
                    </div>
                    <div class="device-selector" onclick="updateDashboard('ST-03', 0.0, 0.0, 0.0, this)">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold fs-5">ST-03</span>
                            <span class="badge bg-danger fs-6">異常停機</span>
                        </div>
                    </div>
                    <div class="device-selector" onclick="updateDashboard('ST-04', 96.2, 19.8, 99.9, this)">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold fs-5">ST-04</span>
                            <span class="badge bg-success fs-6">運轉中</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中間：核心指標 -->
        <div class="col-md-6">
            <!-- 改用 d-flex flex-column 與 gap-3 讓上下間距與左右完全相同 -->
            <div class="d-flex flex-column h-100 gap-3">
                <!-- 上半部：稼動率 (利用 flex: 3 佔據約 60% 高度) -->
                <div class="dashboard-card m-0" style="flex: 3;">
                    <div class="card-header-dark" id="display-name">ST-01 設備稼動率</div>
                    <div class="p-4 flex-grow-1 d-flex flex-column justify-content-center">
                        <div class="hero-metric">
                            <span class="metric-label">整體設備稼動率 (OEE)</span>
                            <div class="val-hero mt-3"><span id="oee-num">94.5</span><small class="fs-4 text-muted">%</small></div>
                            <div class="progress mt-4 mx-auto" style="height: 16px; background: #e9ecef; border-radius: 10px; width: 80%;">
                                <div id="oee-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 94.5%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 下半部：生產速度與良品率 (利用 flex: 2 佔據約 40% 高度) -->
                <div class="d-flex gap-3" style="flex: 2;">
                    <div class="dashboard-card param-box w-50 m-0">
                        <span class="metric-label">生產速度</span>
                        <div class="param-val text-primary"><span id="speed-num">18.5</span> <small class="fs-5 text-muted">pcs/min</small></div>
                    </div>
                    <div class="dashboard-card param-box w-50 m-0">
                        <span class="metric-label">良品率</span>
                        <div class="param-val text-success"><span id="yield-num">99.8</span> <small class="fs-5 text-muted">%</small></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：即時動態與圖表 -->
        <div class="col-md-3">
            <!-- 同樣改用 d-flex flex-column 與 gap-3 -->
            <div class="d-flex flex-column h-100 gap-3">
                <!-- 上半部：即時動態 (flex: 1 佔一半) -->
                <div class="dashboard-card m-0" style="flex: 1;">
                    <div class="card-header-dark">即時動態</div>
                    <div class="p-3 flex-grow-1 overflow-auto">
                        <div class="border-start border-3 border-danger ps-3 mb-3">
                            <small class="text-danger fw-bold">14:02 異常通知</small>
                            <p class="small m-0">ST-03 偵測到馬達溫度過高</p>
                        </div>
                        <div class="border-start border-3 border-primary ps-3 mb-3">
                            <small class="text-primary fw-bold">13:30 系統記錄</small>
                            <p class="small m-0">王大明 登入系統並接管線別</p>
                        </div>
                        <div class="border-start border-3 border-success ps-3 mb-3">
                            <small class="text-success fw-bold">12:00 產量達標</small>
                            <p class="small m-0">ST-01 上午批次生產完成</p>
                        </div>
                    </div>
                </div>
                <!-- 下半部：OEE走勢圖 (flex: 1 佔一半) -->
                <div class="dashboard-card m-0" style="flex: 1;">
                    <div class="card-header-dark">OEE 走勢圖 (近4小時)</div>
                    <div class="p-3 flex-grow-1">
                        <div class="chart-placeholder">
                            📈 這裡可以放置走勢圖
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 更新儀表板數據函數
    function updateDashboard(name, oee, speed, yieldRate, element) {
        document.getElementById('display-name').innerText = name + ' 設備稼動率';
        document.getElementById('oee-num').innerText = oee.toFixed(1);
        document.getElementById('speed-num').innerText = speed.toFixed(1);
        document.getElementById('yield-num').innerText = yieldRate.toFixed(1);

        const bar = document.getElementById('oee-bar');
        bar.style.width = oee + '%';
        
        // 顏色切換邏輯
        bar.className = 'progress-bar progress-bar-striped progress-bar-animated';
        if(oee < 50) bar.classList.add('bg-danger');
        else if(oee < 85) bar.classList.add('bg-warning');
        else bar.classList.add('bg-success');

        // 更新左側 Active 狀態
        const selectors = document.querySelectorAll('.device-selector');
        selectors.forEach(s => s.classList.remove('active'));
        if(element) element.classList.add('active');
    }

    // 更新頂部時間
    function updateTime() {
        const now = new Date();
        const timeString = now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0') + ' ' + 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0') + ':' + 
            String(now.getSeconds()).padStart(2, '0');
        document.getElementById('current-time').innerText = timeString;
    }
    
    setInterval(updateTime, 1000);
    updateTime(); // 初始呼叫
</script>

</body>
</html>
